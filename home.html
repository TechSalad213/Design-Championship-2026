<!DOCTYPE html>

<html>

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
        <title>SkillBloom | Design Championship 2026</title>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            }

            body {
                background-color: #080612;
                background-image: 
                    radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.18) 0%, transparent 40%),
                    radial-gradient(circle at 85% 75%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                    radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
                min-height: 100vh;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: relative;
            }

            html::-webkit-scrollbar, 
            body::-webkit-scrollbar {
                width: 12px;
            }

            html::-webkit-scrollbar-track, 
            body::-webkit-scrollbar-track {
                background: transparent;
            }

            html::-webkit-scrollbar-thumb, 
            body::-webkit-scrollbar-thumb {
                background:  rgba(60, 63, 146, 0.3);
                border-radius: 2px;
                border: 3px solid  transparent;
                transition: background 0.7s ease-out;
            }

            html::-webkit-scrollbar-thumb:hover, 
            body::-webkit-scrollbar-thumb:hover {
                background: rgba(101, 106, 248, 0.3);
            }

            @view-transition {
                navigation: auto;
            }

            .topBar {
                width: 100%;
                height: 64px;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                background: rgba(13, 10, 25, 0.65);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                position: fixed;
                top: 0;
                left: 0;
                display: flex;
                align-items: center;
                z-index: 100;
                padding: 0 40px;
            }

            .brand {
                font-weight: 700;
                font-size: 18px;
                color: #ffffff;
                padding-left: 0;
                height: 100%;
                display: flex;
                align-items: center;
                gap: 10px;
                letter-spacing: -0.2px;
            }

            .brand img {
                width: 28px;
                height: 28px;
                object-fit: contain;
            }

            .topBar .home, .courses, .mycourses, .contributions, .flux{
                margin-left: 12px;
                text-decoration: none;
                color: rgba(255, 255, 255, 0.75);
                font-size: 13px;
                font-weight: 500;
                background-color: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 20px;
                padding: 7px 16px;
                transition: all 0.2s ease-out;
            }

            .topBar .home:hover, .courses:hover, .mycourses:hover, .contributions:hover {
                background-color: rgba(255, 255, 255, 0.1);
                color: #ffffff;
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-1px);
            }

            .account {
                margin-left: auto;
                margin-right: 0;
                position: relative;
            }

            .account button {
                background: linear-gradient(135deg, rgba(124, 58, 237, 0.6) 0%, rgba(6, 182, 212, 0.6) 100%);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                padding: 8px 20px;
                font-size: 13px;
                font-weight: 600;
                transition: all 0.2s ease;
                color: #ffffff;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(124, 58, 237, 0.25);
            }

            .account button:hover {
                opacity: 0.95;
                transform: translateY(-1px);
                box-shadow: 0 6px 20px rgba(124, 58, 237, 0.35);
            }

            .account button:focus {
                outline: none;
            }

            .account button:active {
                transform: scale(0.98);
            }

            .account-menu {
                background: rgba(18, 14, 32, 0.95);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                padding: 8px;
                display: none;
                right: 0;
                top: 48px;
                flex-direction: column;
                position: absolute;
                gap: 4px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 14px;
                min-width: 170px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
                z-index: 101;
            }

            .account-menu a {
                background-color: transparent;
                padding: 10px 14px;
                text-decoration: none;
                font-size: 13px;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.8);
                border: none;
                border-radius: 8px;
                transition: all 0.2s ease;
            }

            .account-menu a:hover {
                background-color: rgba(255, 255, 255, 0.08);
                color: #ffffff;
            }

            .upload {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 8px 17px;
                font-size: 16px;
                font-weight: 600;
                color: #ffffff;
                background-color: #4f46e5;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.1s ease;
                margin-left: 7px;
                margin-left: 30px;
              }

            .upload:hover {
                background-color: #4338ca;
              }

            .upload:active {
                transform: scale(0.98);
              }

            .account-menu button {
                background-color: rgba(239, 68, 68, 0.15);
                border: 1px solid rgba(239, 68, 68, 0.2);
                border-radius: 8px;
                padding: 8px 14px;
                margin-top: 4px;
                width: 100%;
                font-size: 12px;
                box-shadow: none;
            }

            .account-menu button:hover {
                background-color: rgba(239, 68, 68, 0.3);
                box-shadow: none;
            }

            .searchBar {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 30px;
                z-index: 10;
            }

            .heading {
                color: #ffffff;
                letter-spacing: -0.8px;
                word-spacing: normal;
                font-size: 48px;
                font-weight: 800;
                line-height: 1.15;
                background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: float 7s infinite ease-in-out;
            }

            .search {
                position: relative;
                width: 500px;
                max-width: 90vw;
            }

            .text {
                background: rgba(255, 255, 255, 0.04);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                padding: 16px 52px 16px 24px;
                border-radius: 30px;
                color: #ffffff;
                font-size: 15px;
                width: 100%;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
                transition: all 0.3s ease-out;
            }

            .text:focus {
                outline: none !important;
                border-color: rgba(124, 58, 237, 0.6);
                background: rgba(255, 255, 255, 0.07);
                box-shadow: 0 0 30px rgba(124, 58, 237, 0.25);
            }

            .text::placeholder {
                color: rgba(255, 255, 255, 0.4);
            }

            .searchBar i {
                position: absolute;
                right: 20px;
                top: 50%;
                color: rgba(255, 255, 255, 0.6);
                font-size: 22px;
                transform: translateY(-50%);
                pointer-events: none;
            }

            .pianofloat {
                position: absolute;
                bottom: 60%;
                left: 18%;
                cursor: pointer;
                z-index: 5;
                padding: 14px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 20px;
                backdrop-filter: blur(12px);
                transition: all 0.3s ease-in-out;
                animation: float 7s infinite ease-out;
            }

            .paintfloat {
                position: absolute;
                bottom: 40%;
                right: 18%;
                cursor: pointer;
                z-index: 5;
                padding: 14px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 20px;
                backdrop-filter: blur(12px);
                transition: all 0.3s ease-out;
                animation: float 7s infinite ease-out;
            }

            .pianofloat img, .paintfloat img {
                width: 44px;
                height: auto;
                display: block;
                animation: float 6s infinite ease-in-out;
                filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            }

            .paintfloat img {
                animation: float 7s infinite ease-in-out;
            }

            .orbfloat {
                position: absolute;
                border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #38bdf8 0%, #0284c7 100%);
                border: 1px solid rgba(255, 255, 255, 0.4);
                width: 24px !important;
                height: 24px !important;
                min-width: 24px;
                min-height: 24px;
                filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6));
                top: 22%;
                left: 50%;
                transform: translateX(-50%);
                animation: float 5s infinite ease-in-out;
                cursor: pointer;
                transition: all 0.3s ease;
                z-index: 5;
            }

            .paintfloat:hover, .pianofloat:hover {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-4px);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            }

            .orbfloat:hover {
                filter: drop-shadow(0 0 24px rgba(217, 70, 239, 0.9));
                animation-play-state: paused;
                background: radial-gradient(circle at 30% 30%, #f472b6 0%, #c084fc 100%);
                border-color: transparent;
                transform: translateX(-50%) scale(1.2);
            }

            @keyframes float {
                0%, 100% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-8px);
                }
            }

            #skillsContainer {
                position: absolute;
                top: 65%;
                width: 90%;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 25px;
                z-index: 20;
            }

            #skillsContainer > div {
                width: 300px;
                padding: 25px;
                border-radius: 18px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        </style>
    </head>

    <body>

        <div class="topBar">
            <div class="brand">|
                <img src="SKILLBLOOM.png" width="40px" height="auto">
                <span>SkillBloom | </span>
            </div>
            <a href="home.html" class="home">Home</a>
            <a href="courses.html" class="courses">Suggested Courses</a>
            <a href="my-courses.html" class="mycourses">My Courses</a>
            <a href="contributions.html" class="contributions">Contributions</a>
            <a href="ai.html" class="flux">Chat with FLUX</a>
            <button class="upload" onclick="window.location.replace('upload_skill.html')">Create Course +</button>

            <div class="account">
                <button id="welcome" onclick="document.querySelector('.account-menu').style.display = 'flex'">Account</button>
                
                <div class="account-menu">
                    <a href="log-out.html" id="logOut">Log Out</a>
                    <button onclick="document.querySelector('.account-menu').style.display = 'none'">Close</button>
                </div>
            </div>
        </div>

        <div class="searchBar">
            <h1 class="heading">Learn With Just a Click</h1>
            <div class="search">
                <input type="search" placeholder="Search for Courses..." class="text" id="inputsearch">
                <i class="bx bx-search"></i>
            </div>
        </div>

        <div class="pianofloat" onclick="actiavteShortcut('Piano Tutorials')">
            <img src="PIANO .png" width="20%" height=auto>
        </div>

        <div class="paintfloat" onclick="actiavteShortcut('Art Course')">
            <img src="PAINT.png" width="20%" height=auto>
        </div>

        <div class="orbfloatcontainer">
        <div class="orbfloat" onclick="actiavteShortcut('3d Design')"></div></div>

        <div id="skillsContainer"></div>

        <script>
            function actiavteShortcut(shortcut) {
                searchBar = document.getElementById('inputsearch');
                inputsearch.value = shortcut;
                inputsearch.dispatchEvent(new Event("input"));
                inputsearch.focus();
            }

            const username = localStorage.getItem("username");
            const firstName = localStorage.getItem("username").split(" ")[0];
            const logout = document.getElementById("logOut");

            document.getElementById("welcome").innerText = `Hello ${firstName}!`;

            logout.addEventListener("click", () => {
                localStorage.removeItem("username");
                window.location.replace("main.html");
            })

            const searchInput = document.getElementById("inputsearch");
            const container = document.getElementById("skillsContainer");

            fetch("/skills")
                .then(response => response.json())
                .then(skills => {

                const allSkills = [];

                for (const userId in skills) {
                    for (const skillId in skills[userId]) {
                        allSkills.push(skills[userId][skillId]);
                }
                }

                searchInput.addEventListener("input", () => {
                    let count = 0
                    const query = searchInput.value.toLowerCase();
                    container.innerHTML = "";

                    for (const skills of allSkills) {
                        if (query !== "" && skills.heading.toLowerCase().includes(query) && count < 3) {
                            const card = document.createElement("div");
                            card.innerHTML = `
                                <h2 style="color: white;">${skills.name}</h2>
                                <p style="color: white;">${skills.heading}</p>
                            `;
                            container.appendChild(card);
                            count++;
                    };
                    }});
                })
        </script>
    </body>

</html>
