<!DOCTYPE html>
<html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>SkillBloom | Upload Skill</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            background-color: #080612;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.18), transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(6, 182, 212, 0.15), transparent 40%);
            min-height: 100vh;
            color: white;
        }

        .topBar {
            width: 100%;
            height: 64px;
            backdrop-filter: blur(20px);
            background: rgba(13, 10, 25, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            z-index: 100;
            padding: 0 40px;
        }

        .brand {
            font-weight: 700;
            font-size: 18px;
            color: white;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .topBar a {
            margin-left: 12px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 7px 16px;
        }

        .topBar a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .account {
            margin-left: auto;
            position: relative;
        }

        .account button {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.6), rgba(6, 182, 212, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        .account-menu {
            background: rgba(18, 14, 32, 0.95);
            backdrop-filter: blur(24px);
            padding: 8px;
            display: none;
            right: 0;
            top: 48px;
            flex-direction: column;
            position: absolute;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            min-width: 170px;
        }

        .account-menu a {
            margin: 0;
            background: transparent;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .container {
            padding: 105px 20px 50px;
            display: flex;
            justify-content: center;
        }

        .form-card {
            width: 850px;
            max-width: 100%;
            background: rgba(18, 14, 32, 0.72);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
        }

        .form-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.35), rgba(6, 182, 212, 0.35));
        }

        .icon i {
            font-size: 27px;
        }

        .form-header h1 {
            font-size: 25px;
        }

        .form-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            margin-top: 4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 13px 15px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(124, 58, 237, 0.7);
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        select option {
            background: #181329;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .level-buttons {
            display: flex;
            gap: 8px;
        }

        input[type="file"]::file-selector-button {
            display: none;
        }

        .level-buttons label {
            flex: 1;
            padding: 12px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.045);
            color: rgba(255, 255, 255, 0.65);
            text-align: center;
            cursor: pointer;
            font-size: 11px;
        }

        .level-buttons input {
            display: none;
        }

        .level-buttons label:hover {
            background: rgba(124, 58, 237, 0.2);
            color: white;
        }

        .upload-box {
            height: 120px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .upload-box:hover {
            background: rgba(124, 58, 237, 0.08);
            border-color: rgba(124, 58, 237, 0.5);
        }

        .upload-box i {
            font-size: 28px;
        }

        .upload-box span {
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
            font-weight: 600;
        }

        .upload-box small {
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
        }

        .publish-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #stagebtn {
            width: 100%;
            padding: 14px;
            border: 2px solid rgba(124, 58, 237, 0.192);
            border-radius: 12px;
            background: transparent;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transform: all 0.5s ease;
        }

        #stagebtn:hover {
            border: 2px solid rgba(124, 58, 237, 0.356);
        }

        #stageWarning {
            position: fixed;
            bottom: 30px;
            left: 50%;

            transform: translateX(-50%) translateY(100px);

            background: rgba(18, 14, 32, 0.95);
            border: 1px solid rgba(124, 58, 237, 0.5);
            border-radius: 14px;

            padding: 14px 22px;

            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            opacity: 0;
            pointer-events: none;

            transition: 0.4s ease;
        }

        @view-transition {
                navigation: auto;
            }

        #stageWarning.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            }

        @media (max-width: 700px) {

            .topBar {
                padding: 0 15px;
            }

            .topBar .courses, .topBar .mycourses, .topBar .contributions {
                display: none;
            }

            .form-card {
                padding: 25px 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .level-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="topBar">

        <div class="brand">
            <img src="SKILLBLOOM.png">
            <span>SkillBloom</span>
        </div>

        <a href="home.html">Home</a>
        <a href="courses.html" class="courses">Suggested Courses</a>
        <a href="my-courses.html" class="mycourses">My Courses</a>
        <a href="contributions.html" class="contributions">Contributions</a>

        <div class="account">

            <button onclick="document.querySelector('.account-menu').style.display = 'flex'">
                Account
            </button>

            <div class="account-menu">
                <a href="log-out.html" id="logOut">Log Out</a>
                <button onclick="document.querySelector('.account-menu').style.display = 'none'">Close</button>
            </div>

        </div>

    </div>

    <div class="container">

        <div class="form-card">

            <div class="form-header">

                <div class="icon">
                    <i class='bx bx-leaf'></i>
                </div>

                <div>
                    <h1>Upload a Skill</h1>
                    <p>Share something you know and help someone else grow.</p>
                </div>

            </div>

            <form action="/uploadSkill" method="POST" enctype="multipart/form-data" id="form">

                <div class="input-group">
                    <label>Skill Name</label>
                    <input type="text" name="skillName" placeholder="e.g. Piano, Python, Sketching..." required>
                </div>
                <div class="input-group">

                    <label>Category</label>

                    <select name="category" required id="category">
                        <option value="" disabled selected>Choose a category</option>
                        <option>Programming</option>
                        <option>Music</option>
                        <option>Art & Design</option>
                        <option>Sports</option>
                        <option>Languages</option>
                        <option>Academic</option>
                        <option>Other</option>
                    </select>
                
                </div>

                <div class="input-group">
                    <br>
                    <label>What will people learn?</label>
                    <input type="text" name="learning" id="learn" placeholder="e.g. Learn the basics of playing piano" required>
                </div>

                <div class="row">

                    <div class="input-group">
                        <label>What do they need?</label>
                        <input type="text" name="requirements" placeholder="e.g. Laptop, piano..." id="itemsNeeded">
                    </div>

                    <div class="input-group">
                        <label>Estimated Learning Time</label>
                        <input type="text" name="learningTime" placeholder="e.g. 2 weeks" id="learningTime">
                    </div>

                </div>
                <br>
                <div class="input-group">

                    <label>Skill Description</label>

                    <textarea
                        name="description"
                        placeholder="Explain the skill and share useful tips..."
                        required
                    ></textarea>

                </div>

                <h2>Set Up Stages: </h2>
                <div id="stagesContainer"></div>
                <button id="stagebtn" type="button" onclick="addStage()"> + Add Stage</button>

                <button type="submit" class="publish-btn">
                    <i class='bx bx-leaf'></i>
                    Set up your course
                </button>

            </form>

        </div>

    </div>

    <div id="stageWarning">
        <i class='bx bx-error-circle'></i>
        <span>You must add at least one stage!</span>
    </div>

    <script>
        let stageNum = 0;

        function addStage() {
            stageNum++;

        const stage = document.createElement("div");
            stage.classList.add("stage");

        stage.innerHTML = `
            <h2>Stage ${stageNum}</h2><br><br>

            <input class="stageTitle" placeholder="Stage Title">
            <br><br>

            <textarea class="stagedesc" placeholder="Stage Description"></textarea>
            <br><br>

            <input type="file" name="stageFile" class="stageattch">
            <br><br><br>
        `;

        document
            .getElementById("stagesContainer")
            .appendChild(stage);
        }


        document.getElementById("form").addEventListener("submit", async function(event) {
            console.log("SUBMIT FIRED");

            event.preventDefault();

            if (stageNum === 0) {
            document
                .getElementById("stageWarning")
                .classList.add("show");

            setTimeout(() => {
                document
                    .getElementById("stageWarning")
                    .classList.remove("show");
                }, 3000);

            return;
        }

        const name = document.querySelector('[name="skillName"]').value;
        const heading = document.querySelector('[name="learning"]').value;
        const description = document.querySelector('[name="description"]').value;

        const stages = [];

        document.querySelectorAll(".stage").forEach((stage, index) => {

            stages.push({
                number: index + 1,
                title: stage.querySelector(".stageTitle").value,
                description: stage.querySelector(".stagedesc").value,
                attachment: stage.querySelector(".stageattch").files[0]?.name
            });

        });

        const formData = new FormData(document.getElementById("form"));
        formData.append("userId", localStorage.getItem("userId"));
        formData.append("stages", JSON.stringify(stages));

        const response = await fetch("/uploadSkill", {

            method: "POST",
            body: formData
        });

        const result = await response.json();

        console.log(result);
        if (result.success) {
            window.location.href = "courses.html";
        }

    });

    </script>

</body>

</html>
